<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Rekap Jawaban Ekspor CPO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: satu kolom, panel masuk lalu tabel rekap lebar dengan gulir horizontal */
:root{
  --bg:#f5f6f3; --surface:#fff; --fg:#1d2420; --muted:#5c6660; --line:#d6dbd5; --accent:#7a4a12; --ok:#2d7d4e; --err:#b5541c;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{--bg:#141917;--surface:#1c2320;--fg:#e7ece8;--muted:#a3ada6;--line:#2f3934;--accent:#e0a35a;--ok:#62c18a;--err:#ef8a52;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-block:32px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,4vw,36px);margin:4px 0 0;line-height:1.1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:end}
label{display:grid;gap:5px;font-size:13px;font-weight:600}
input,select{font:inherit;font-size:14.5px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:8px 10px;min-width:0}
input:focus-visible,select:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:600;font-size:14px;background:var(--fg);color:var(--bg);border:0;border-radius:5px;padding:9px 18px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:13px;color:var(--muted)} .msg.ok{color:var(--ok)} .msg.err{color:var(--err)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
td.num{font-variant-numeric:tabular-nums;text-align:center}
td.ans{min-width:220px;max-width:320px;white-space:pre-wrap}
td.empty{text-align:center;color:var(--muted);padding:20px}
tbody tr:last-child td{border-bottom:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Khusus dosen · Transportasi Multimoda</div>
    <h1>Rekap Jawaban Ekspor CPO</h1>
  </header>

  <form class="panel" id="masuk">
    <label for="kunci">Kata sandi admin<input id="kunci" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit" id="b-muat">Muat rekap</button>
    <span class="msg" id="m-masuk" role="status"></span>
  </form>

  <section id="hasil" hidden>
    <div class="panel">
      <label for="f-kelas">Kelas<select id="f-kelas"><option value="">Semua kelas</option></select></label>
      <button class="btn" type="button" id="b-xlsx">Unduh xlsx</button>
      <button class="btn ghost" type="button" id="b-segar">Muat ulang</button>
      <span class="msg" id="m-hasil" role="status"></span>
    </div>
    <div class="tbl" style="margin-top:14px">
      <table><thead><tr><th>Absen</th><th>Nama Lengkap</th><th>Notar</th><th>Kelas</th><th>Jawaban 1</th><th>Jawaban 2</th><th>Jawaban 3</th><th>Waktu kirim</th></tr></thead>
      <tbody id="isi"></tbody></table>
    </div>
  </section>
</div>
<script>
/* Ganti dengan URL Web app yang sama seperti di index.html. */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbznCjJIyg9_dL_SgHRjs1m1ru0UzI18SVP8jWWeOlqdivpZy_UrBW_K5GKBOkcd7RO_jQ/exec';

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{ const d=new Date(s); return isNaN(d)?String(s||''):d.toLocaleString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); };
let rows=[], kunci='';

async function muat(){
  const res=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'export',key:kunci})});
  const out=await res.json();
  if(!out.ok) throw new Error(out.error||'Rekap gagal dimuat.');
  rows=out.rows.sort((a,b)=>a.kelas.localeCompare(b.kelas)||((+a.absen||0)-(+b.absen||0)));
  const kelas=[...new Set(rows.map(r=>r.kelas))].sort();
  const sel=$('f-kelas'), cur=sel.value;
  sel.innerHTML='<option value="">Semua kelas</option>'+kelas.map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join('');
  if(kelas.includes(cur)) sel.value=cur;
  render();
}
function terpilih(){ const k=$('f-kelas').value; return k?rows.filter(r=>r.kelas===k):rows; }
function render(){
  const list=terpilih();
  $('m-hasil').className='msg'; $('m-hasil').textContent=list.length+' jawaban';
  $('b-xlsx').disabled=!list.length;
  $('isi').innerHTML=list.length?list.map(r=>`<tr><td class="num">${esc(r.absen)}</td><td>${esc(r.nama)}</td><td class="num">${esc(r.notar)}</td><td>${esc(r.kelas)}</td><td class="ans">${esc(r.q1)}</td><td class="ans">${esc(r.q2)}</td><td class="ans">${esc(r.q3)}</td><td>${esc(fmt(r.waktu))}</td></tr>`).join(''):'<tr><td colspan="8" class="empty">Belum ada jawaban masuk.</td></tr>';
}

$('masuk').addEventListener('submit',async e=>{
  e.preventDefault();
  kunci=$('kunci').value;
  if(!/^https:\/\/script\.google\.com\//.test(SCRIPT_URL)){ $('m-masuk').className='msg err'; $('m-masuk').textContent='Isi SCRIPT_URL di admin.html lebih dulu.'; return; }
  $('b-muat').disabled=true; $('m-masuk').className='msg'; $('m-masuk').textContent='Memuat…';
  try{ await muat(); $('m-masuk').className='msg ok'; $('m-masuk').textContent='Rekap termuat.'; $('hasil').hidden=false; }
  catch(err){ $('m-masuk').className='msg err'; $('m-masuk').textContent=err.message==='Failed to fetch'?'Server tidak terjangkau. Periksa koneksi dan SCRIPT_URL.':err.message; }
  finally{ $('b-muat').disabled=false; }
});
$('f-kelas').addEventListener('change',render);
$('b-segar').addEventListener('click',async()=>{ $('m-hasil').textContent='Memuat ulang…'; try{ await muat(); }catch(err){ $('m-hasil').className='msg err'; $('m-hasil').textContent=err.message; } });

$('b-xlsx').addEventListener('click',()=>{
  if(typeof XLSX==='undefined'){ $('m-hasil').className='msg err'; $('m-hasil').textContent='Pustaka xlsx gagal dimuat. Periksa koneksi internet.'; return; }
  const list=terpilih();
  const aoa=[['No','Nomor Absen','Nama Lengkap','Notar','Kelas','Jawaban 1','Jawaban 2','Jawaban 3','Waktu Kirim','Nilai']]
    .concat(list.map((r,i)=>[i+1,+r.absen||r.absen,r.nama,r.notar,r.kelas,r.q1,r.q2,r.q3,fmt(r.waktu),'']));
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:4},{wch:8},{wch:28},{wch:14},{wch:10},{wch:50},{wch:50},{wch:50},{wch:17},{wch:8}];
  ws['!autofilter']={ref:'A1:J'+(list.length+1)};
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Jawaban');
  const k=$('f-kelas').value;
  const tgl=new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb,`jawaban-ekspor-cpo${k?'-'+k.replace(/[^A-Za-z0-9]+/g,'-'):''}-${tgl}.xlsx`);
});
</script>
</body>
</html>
